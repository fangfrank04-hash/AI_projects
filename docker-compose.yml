# AI 监考服务 —— 内网部署启动脚本
#
# 用法（在内网服务器、docker-compose.yml 所在目录执行）：
#   1. 先加载镜像：   docker load -i aiproctor_1.1.0.tar
#   2. 启动服务：     docker compose up -d
#   3. 查看日志：     docker compose logs -f
#   4. 停止服务：     docker compose down
#
# 说明：镜像已自包含（Python 3.12.9 + 所有库 + 代码 + 模型），内网无需联网。
services:
  aiproctor:
    image: aiproctor:1.1.0        # 与 docker build -t 的名字一致；docker load 后就是这个名字
    container_name: aiproctor
    ports:
      - "8000:8000"               # 左边是宿主机端口，如内网要用别的端口改左边即可，如 "9000:8000"
    restart: unless-stopped       # 容器异常退出/服务器重启后自动拉起
    # 可选：复制 .env.example 为 .env 后，可覆盖识别阈值；文件不存在时使用代码默认值。
    env_file:
      - path: .env
        required: false
    environment:
      - LOG_LEVEL=INFO
    # 健康检查：定时打 /ping，容器状态里能看到 healthy/unhealthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
