# AiProctor 内网 pip 配置（与组长 IARM-APP 保持一致）
#
# 使用方式（三选一）：
#   1. 本文件放到用户目录：   ~/.pip/pip.conf        （当前用户生效）
#   2. 本文件放到系统目录：   /etc/pip.conf           （全局生效）
#   3. 环境变量覆盖：
#        export PIP_CONFIG_FILE=/path/to/pip.conf
#
[global]
index-url=http://ccdc-pypi.pkg.coding.ccdc.com.cn/scm/pub-pypi/simple
trusted-host=ccdc-pypi.pkg.coding.ccdc.com.cn
find-links=/tmp/wheelhouse/pypi /tmp
timeout=600

[install]
no-cache-dir=true
