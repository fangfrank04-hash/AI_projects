[project]
name = "aiproctor0623"
version = "0.1.0"
description = "AI 智能监考服务（FastAPI + MediaPipe）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.138.0",
    "logic>=0.2.3",
    "mediapipe==0.10.20",
    "numpy>=1.26",
    "opencv-python==4.8.1.78",
    "pillow>=10.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# 图片监考核心逻辑仍保留匈牙利命名，命名规范整改分批进行，先只跑基础规则
extend-exclude = [".venv", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# 匈牙利命名的历史文件暂不强制改名，避免一次大改引入回归
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/ml/front_camera.py" = ["F401", "E402"]
"app/ml/back_camera.py" = ["F401", "E402"]
# 测试通过 sys.path.insert 注入根目录后再 import，属合理模式
"tests/test_accuracy.py" = ["E402"]
