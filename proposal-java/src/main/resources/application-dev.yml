spring:
  datasource:
    url: jdbc:h2:file:./data/proposal_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: classpath:data.sql
      continue-on-error: true

# 开发环境禁用安全过滤
sso:
  enabled: false
